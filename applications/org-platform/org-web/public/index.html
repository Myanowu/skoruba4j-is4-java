<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>組織與人員</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M4 20V10h4v10H4zm6 0V4h4v16h-4zm6 0v-7h4v7h-4z"/>
          </svg>
        </span>
        <div>
          <strong>組織與人員</strong>
          <span>組織架構 · 崗位 · 人員</span>
        </div>
      </div>
      <nav class="appnav" aria-label="功能">
        <button type="button" class="tab active" data-panel="org">組織架構</button>
        <button type="button" class="tab" data-panel="forms">表單</button>
        <button type="button" class="tab" data-panel="inbox">待辦</button>
        <button type="button" class="tab" data-panel="self">查詢</button>
      </nav>
      <div class="session" id="session"></div>
    </header>

    <section id="panel-org" class="panel active workspace">
      <aside class="tree-pane">
        <div class="pane-head">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2z"/>
            </svg>
            <input id="treeSearch" type="search" placeholder="搜尋部門、姓名、工號" autocomplete="off" />
            <div id="searchResults" class="search-results" hidden></div>
          </div>
          <button type="button" id="btnAddRoot" class="btn ghost">新增</button>
        </div>
        <div id="tree" class="tree" role="tree" aria-label="組織樹"></div>
        <div class="pane-foot">
          <button type="button" id="btnReload" class="btn text">重新整理</button>
          <button type="button" id="btnSeedChart" class="btn text">載入示範架構</button>
        </div>
      </aside>
      <section id="detail" class="detail-pane" aria-live="polite"></section>
    </section>

    <section id="panel-forms" class="panel pad">
      <div class="card">
        <h3>提交請假單</h3>
        <div class="row wrap">
          <label>發起人 <input id="userId" value="alice" /></label>
          <input id="leaveDays" type="number" value="2" min="0.5" step="0.5" />
          <input id="leaveReason" placeholder="事由" value="personal" />
          <input id="leaveAmount" type="number" value="3" title="amount" />
          <input id="leaveOrgUnit" placeholder="部門編號" />
          <button type="button" id="btnSubmitLeave" class="btn primary">提交</button>
          <button type="button" id="btnSeed" class="btn ghost">載入請假示範</button>
        </div>
        <pre id="formOut" class="box"></pre>
      </div>
      <div class="card">
        <h3>已發佈表單</h3>
        <pre id="formDefs" class="box"></pre>
      </div>
    </section>

    <section id="panel-inbox" class="panel pad">
      <div class="row">
        <label>審批人 <input id="approverId" value="manager1" /></label>
        <button type="button" id="btnInbox" class="btn primary">刷新待辦</button>
      </div>
      <div id="inboxList"></div>
    </section>

    <section id="panel-self" class="panel pad">
      <div class="row wrap">
        <button type="button" id="btnMine" class="btn primary">我發起的</button>
        <input id="orgPath" placeholder="組織路徑，例如 /HQ" value="/HQ" />
        <button type="button" id="btnOrgQuery" class="btn ghost">本組織單據</button>
        <button type="button" id="btnExport" class="btn ghost">匯出</button>
      </div>
      <pre id="selfOut" class="box"></pre>
    </section>
  </div>

  <dialog id="dialog" class="dialog">
    <form id="dialogForm">
      <header class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button type="button" id="dialogClose" class="icon-btn" aria-label="關閉">×</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
      <footer class="dialog-foot">
        <button type="button" class="btn danger" id="dialogDanger" hidden>停用</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="dialogCancel">取消</button>
        <button type="submit" class="btn primary" id="dialogSave">儲存</button>
      </footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/js/app.js"></script>
</body>
</html>
