about.title=About Skoruba4j
about.lead=Skoruba4j is a Java STS and OpenID Provider for existing IdentityServer4 + Skoruba databases and /connect clients. It is not Keycloak, Casdoor, MaxKey, or a greenfield IAM.
about.special.title=What is special
about.special.tables=Same IS4 / Identity tables (not oauth2_registered_client).
about.special.paths=Same public paths: /connect/* and OpenID Discovery.
about.special.aud=Same JWT aud = ApiResources.Name, same ASP.NET Identity password hashes.
about.protocols.title=Protocols
about.protocols.y=Ships with tests: OpenID Connect 1.0 (Discovery, JWKS, Authorization Code + PKCE, ID Token, UserInfo, RP-Initiated Logout) and OAuth 2.0 (authorization_code, refresh_token / offline_access). Access tokens are JWTs.
about.protocols.p=Partial: token introspection, revocation, client_credentials, device code, IS4 delegation. Out of scope: implicit, resource owner password, mTLS, opaque reference tokens at the STS.
about.processes.title=Processes
about.processes.sts=skoruba4j-sts — this product's OpenID Provider and login UI on IS4 paths.
about.processes.admin=skoruba4j-admin — this UI. It can sign in against the Users table, or as an OIDC client of the STS.
about.processes.api=skoruba4j-admin-api — REST over the same tables.
about.processes.console=skoruba4j-console — optional Swing ops window. It polls GET /health; that probe is not a product page.
about.contracts.title=Locked contracts
about.contracts.paths=Paths stay /connect/*.
about.contracts.aud=Access-token audience is ApiResources.Name.
about.contracts.password=Passwords verify ASP.NET Identity PBKDF2; new hashes write Identity v3.
about.contracts.stack=Stack: JDK 21, Spring Boot 3.5, JDBC only. License: Apache-2.0. Not OpenID Certified.
about.github.title=GitHub
about.github.body=Clone, mvn package, then open /about and /health. English docs start at the repository README; Chinese overview is docs/zh/README.md. The longer About text is docs/ABOUT.md.
guide.title=What this UI does
guide.p1=Skoruba4j is a Java STS / OpenID Provider for existing IdentityServer4 / Skoruba data. This skoruba4j-admin UI manages clients, users, roles, APIs and issued grants. Data stays in the original tables. Access-token aud uses ApiResources.Name. Passwords are written as ASP.NET Identity v3 PBKDF2 so the same user still matches the old site.
guide.p2=skoruba4j-sts handles login and issues tokens on /connect/* (OpenID Connect 1.0 and OAuth 2.0: Authorization Code + PKCE, refresh token; Discovery / JWKS / UserInfo / endsession). This UI can be an optional OIDC client of the STS. skoruba4j-admin-api uses REST on the same tables. All three share one database.
guide.sections=Sections
guide.sec.home=Overview: product mark in the top bar returns here. Status chips and this guide.
guide.sec.clients=Clients: OAuth/OIDC clients — ClientId, secrets, redirect URIs, logout URIs, allowed grants and scopes.
guide.sec.users=Users: username, email, lockout, and roles. New passwords are written as Identity v3 hashes.
guide.sec.roles=Roles: role names, role claims, and users in role. Data pages require the role configured in idserver.admin.role.
guide.sec.apiResources=ApiResources: API resources (Name / Display / Discovery / Enabled / signing / Scopes / Claims / Secrets / Properties). Access-token aud is Name.
guide.sec.apiScopes=ApiScopes: API scopes that clients request and that attach to ApiResources.
guide.sec.identityResources=IdentityResources: identity resources such as openid, profile, email — claims for id_token and userinfo.
guide.sec.grants=Persisted Grants: grants by subject; revoke one entry or all for that user (refresh / code, and so on).
guide.sec.audit=Audit Log: browse and filter Skoruba AuditLog; delete by date. Admin changes write brief events.
guide.sec.about=About: product and repository notes.
guide.login.title=Sign-in and sign-out
guide.login.p1=When signed out, Overview and data pages go to this UI's /login. The process probe remains GET /health and is not in the top bar. After sign-in the top-right shows the username. Menu: User info opens a dialog; Sign out ends this UI session. An OIDC session also calls STS endsession.
guide.login.p2=Sign-in mode is set in Control → Settings → Admin sign-in (idserver.admin.login-mode): Local password, STS password (form here, password grant like MobileWeb), or STS OIDC redirect (cross-app SSO). Data pages still require the role in idserver.admin.role.
guide.db.title=Database
guide.db.body=table-style=skoruba uses Users; aspnet uses AspNetUsers. SQL Server, PostgreSQL, MySQL, or first-install SQLite are supported. Without a database URL this page still opens; data pages list nothing. SQLite is for empty environments; production still uses the existing IS4 database.
