about.title=关于 Skoruba4j
about.lead=Skoruba4j 是面向已有 IdentityServer4 + Skoruba 数据库与 /connect 客户端的 Java STS / OpenID Provider。它不是 Keycloak、Casdoor、MaxKey，也不是从零开始的通用 IAM。
about.special.title=特别之处
about.special.tables=沿用 IS4 / Identity 表（不是 oauth2_registered_client）。
about.special.paths=公开路径仍是 /connect/* 与 OpenID Discovery。
about.special.aud=JWT 的 aud 仍是 ApiResources.Name，密码哈希仍是 ASP.NET Identity。
about.protocols.title=协议
about.protocols.y=已有测试：OpenID Connect 1.0（Discovery、JWKS、授权码 + PKCE、ID Token、UserInfo、RP 发起注销）与 OAuth 2.0（authorization_code、refresh_token / offline_access）。访问令牌为 JWT。
about.protocols.p=部分支持：令牌自省、吊销、client_credentials、设备码、IS4 delegation。明确不做：implicit、资源所有者密码、mTLS、STS 侧不透明引用令牌。
about.processes.title=进程
about.processes.sts=skoruba4j-sts — 本产品的 OpenID Provider 与 IS4 路径上的登录界面。
about.processes.admin=skoruba4j-admin — 本管理界面。可对 Users 表做本地登录，也可作为 STS 的 OIDC 客户端。
about.processes.api=skoruba4j-admin-api — 同一批表上的 REST。
about.processes.console=skoruba4j-console — 可选的 Swing 运维窗口。它轮询 GET /health；该探针不是产品页面。
about.contracts.title=锁定约定
about.contracts.paths=路径保持 /connect/*。
about.contracts.aud=访问令牌 audience 为 ApiResources.Name。
about.contracts.password=密码校验 ASP.NET Identity PBKDF2；新哈希写 Identity v3。
about.contracts.stack=技术栈：JDK 21、Spring Boot 3.5、仅 JDBC。许可证：Apache-2.0。未经 OpenID 认证。
about.github.title=GitHub
about.github.body=克隆后执行 mvn package，再打开 /about 与 /health。英文文档从仓库 README 开始；中文概述见 docs/zh/README.md。更长的 About 正文见 docs/ABOUT.md。
guide.title=这个界面做什么
guide.p1=Skoruba4j 是 Java STS / OpenID Provider，用来接上已经存在的 IdentityServer4 / Skoruba 数据。本界面 skoruba4j-admin 管理客户端、用户、角色、API 与已发出的授权。数据仍在原来的表里。访问令牌的 aud 使用 ApiResources 的 Name。密码按 ASP.NET Identity v3 PBKDF2 写入，便于与原来的站点核对同一用户。
guide.p2=skoruba4j-sts 负责登录，并在 /connect/* 按 OpenID Connect 1.0 与 OAuth 2.0 发令牌（授权码 + PKCE、刷新令牌；Discovery / JWKS / UserInfo / endsession）。本界面可以是 STS 的可选 OIDC 客户端。skoruba4j-admin-api 用 REST 读写同一批表。三边共用一份库。
guide.sections=栏目
guide.sec.home=总览：点顶栏产品名回到本页。这里是状态芯片与说明。
guide.sec.clients=客户端：OAuth/OIDC 客户端，含客户端标识、密钥、登录回调、登出回调、允许的授权与作用域。
guide.sec.users=用户：用户名、邮箱、锁定状态与角色。新密码写入 Identity v3 哈希。
guide.sec.roles=角色：角色名、角色声明与角色用户。进入数据页需要具备 idserver.admin.role 配置的那个角色。
guide.sec.apiResources=API 资源：名称 / 显示名 / Discovery / 启用 / 签名 / 作用域 / 声明 / 密钥 / 属性。访问令牌的 aud 取名称。
guide.sec.apiScopes=API 作用域：供客户端申请，并挂到 API 资源上。
guide.sec.identityResources=身份资源：如 openid、profile、email，决定身份令牌与用户信息中的声明。
guide.sec.grants=持久授权：按主体列出授权；可撤销单条或该用户全部（刷新令牌 / 授权码等）。
guide.sec.audit=审计日志：浏览与筛选 Skoruba 审计日志；可按日期清理。管理台变更会写入简要事件。
guide.sec.about=关于：产品与仓库说明。
guide.login.title=登录与登出
guide.login.p1=未登录时，总览和数据页转到本界面的 /login。进程探针仍是 GET /health，不放在顶栏。登录后右上角显示用户名。菜单：用户信息弹出对话框；退出结束本界面会话。OIDC 会话还会走 STS endsession。
guide.login.p2=登录方式由 Control → 设置 → 管理台登录（idserver.admin.login-mode）三选一：本地密码、STS 密码（本页表单、后台 password grant，同 MobileWeb）、STS OIDC 跳转（跨应用单点登录）。进入数据页仍需具备 idserver.admin.role 配置的角色。
guide.db.title=数据库
guide.db.body=table-style=skoruba 时用户表是 Users；aspnet 时是 AspNetUsers。支持 SQL Server、PostgreSQL、MySQL，或首次安装用的内置 SQLite。没有配置数据库 URL 时本页仍能打开，数据页列不出记录。SQLite 只给空环境用，现网仍连已有的 IS4 库。
