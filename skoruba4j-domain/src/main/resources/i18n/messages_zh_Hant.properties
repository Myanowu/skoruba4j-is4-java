home.title=總覽
home.lead=Skoruba4j 管理台用於讀寫既有的 IdentityServer4 / Skoruba 資料庫。下方是目前程序狀態，再往後是各欄目與登入方式說明。
home.signedIn=已登入為 {0}
home.dbMissing=尚未設定資料庫 URL。
home.sqliteWarn=內建 SQLite 僅用於首次安裝與開源示範。正式切換請繼續使用既有的 IS4 SQL Server（或 PostgreSQL / MySQL）。
home.connected=已連線。使用者資料表 {0}
about.title=關於 Skoruba4j
about.lead=Skoruba4j 是面向既有 IdentityServer4 + Skoruba 資料庫與 /connect 用戶端的 Java STS / OpenID Provider。它不是 Keycloak、Casdoor、MaxKey，也不是從零開始的通用 IAM。
about.special.title=特別之處
about.special.tables=沿用 IS4 / Identity 資料表（不是 oauth2_registered_client）。
about.special.paths=公開路徑仍是 /connect/* 與 OpenID Discovery。
about.special.aud=JWT 的 aud 仍是 ApiResources.Name，密碼雜湊仍是 ASP.NET Identity。
about.protocols.title=協定
about.protocols.y=已有測試：OpenID Connect 1.0（Discovery、JWKS、授權碼 + PKCE、ID Token、UserInfo、RP 發起登出）與 OAuth 2.0（authorization_code、refresh_token / offline_access）。存取權杖為 JWT。
about.protocols.p=部分支援：權杖自省、撤銷、client_credentials、裝置碼、IS4 delegation。明確不做：implicit、資源擁有者密碼、mTLS、STS 側不透明參考權杖。
about.processes.title=程序
about.processes.sts=skoruba4j-sts — 本產品的 OpenID Provider 與 IS4 路徑上的登入介面。
about.processes.admin=skoruba4j-admin — 本管理介面。可對 Users 資料表做本機登入，也可作為 STS 的 OIDC 用戶端。
about.processes.api=skoruba4j-admin-api — 同一批資料表上的 REST。
about.processes.console=skoruba4j-console — 可選的 Swing 維運視窗。它輪詢 GET /health；該探針不是產品頁面。
about.contracts.title=鎖定約定
about.contracts.paths=路徑保持 /connect/*。
about.contracts.aud=存取權杖 audience 為 ApiResources.Name。
about.contracts.password=密碼校驗 ASP.NET Identity PBKDF2；新雜湊寫 Identity v3。
about.contracts.stack=技術棧：JDK 21、Spring Boot 3.5、僅 JDBC。授權條款：Apache-2.0。未經 OpenID 認證。
about.github.title=GitHub
about.github.body=複製後執行 mvn package，再開啟 /about 與 /health。英文文件從存放庫 README 開始；中文概述見 docs/zh/README.md。更長的 About 正文見 docs/ABOUT.md。
guide.title=這個介面做什麼
guide.p1=Skoruba4j 是 Java STS / OpenID Provider，用來接上已經存在的 IdentityServer4 / Skoruba 資料。本介面 skoruba4j-admin 管理用戶端、使用者、角色、API 與已發出的授權。資料仍在原來的資料表裡。存取權杖的 aud 使用 ApiResources 的 Name。密碼按 ASP.NET Identity v3 PBKDF2 寫入，便於與原來的站點核對同一使用者。
guide.p2=skoruba4j-sts 負責登入，並在 /connect/* 按 OpenID Connect 1.0 與 OAuth 2.0 發權杖（授權碼 + PKCE、重新整理權杖；Discovery / JWKS / UserInfo / endsession）。本介面可以是 STS 的可選 OIDC 用戶端。skoruba4j-admin-api 用 REST 讀寫同一批資料表。三邊共用一份庫。
guide.sections=欄目
guide.sec.home=總覽：點頂欄產品名回到本頁。這裡是狀態晶片與說明。
guide.sec.clients=用戶端：OAuth/OIDC 用戶端，含用戶端識別碼、金鑰、登入回呼、登出回呼、允許的授權與範圍。
guide.sec.users=使用者：使用者名稱、電子郵件、鎖定狀態與角色。新密碼寫入 Identity v3 雜湊。
guide.sec.roles=角色：角色名、角色宣告與角色使用者。進入資料頁需要具備 idserver.admin.role 設定的那個角色。
guide.sec.apiResources=API 資源：名稱 / 顯示名 / Discovery / 啟用 / 簽章 / 範圍 / 宣告 / 金鑰 / 屬性。存取權杖的 aud 取名稱。
guide.sec.apiScopes=API 範圍：供用戶端申請，並掛到 API 資源上。
guide.sec.identityResources=身分資源：如 openid、profile、email，決定身分權杖與使用者資訊中的宣告。
guide.sec.grants=持久授權：按主體列出授權；可撤銷單筆或該使用者全部（重新整理權杖 / 授權碼等）。
guide.sec.audit=稽核日誌：瀏覽與篩選 Skoruba 稽核日誌；可按日期清理。管理台變更會寫入簡要事件。
guide.sec.about=關於：產品與存放庫說明。
guide.login.title=登入與登出
guide.login.p1=未登入時，總覽和資料頁轉到本介面的 /login。程序探針仍是 GET /health，不放在頂欄。登入後右上角顯示使用者名稱。選單：使用者資訊彈出對話框；登出結束本介面工作階段。OIDC 工作階段還會走 STS endsession。
guide.login.p2=登入方式由 Control → 設定 → 管理台登入（idserver.admin.login-mode）三選一：本機密碼、STS 密碼（本頁表單、後台 password grant，同 MobileWeb）、STS OIDC 重新導向（跨應用單一登入）。進入資料頁仍需具備 idserver.admin.role 設定的角色。
guide.db.title=資料庫
guide.db.body=table-style=skoruba 時使用者資料表是 Users；aspnet 時是 AspNetUsers。支援 SQL Server、PostgreSQL、MySQL，或首次安裝用的內建 SQLite。沒有設定資料庫 URL 時本頁仍能開啟，資料頁列不出記錄。SQLite 只給空環境用，現網仍連既有的 IS4 庫。
